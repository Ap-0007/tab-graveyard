<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Graveyard Settings</title>
  <link rel="stylesheet" href="options.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>🪦 Tab Graveyard Settings</h1>
    </header>
    
    <div class="section">
      <h2>Inactivity Timeout</h2>
      <p>How long before an untouched tab is archived?</p>
      <div class="control-group">
        <input type="number" id="daysInput" min="1" max="30" value="3">
        <span>days</span>
      </div>
    </div>

    <div class="section">
      <h2>Domain Whitelist</h2>
      <p>Tabs from these domains will never be auto-archived. Enter one domain per line (e.g., <code>youtube.com</code>).</p>
      <textarea id="whitelistInput" rows="5" placeholder="github.com&#10;music.youtube.com"></textarea>
    </div>

    <button id="saveBtn" class="btn btn-save">Save Settings</button>
    <div id="statusMessage" class="status hidden">Settings saved!</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
