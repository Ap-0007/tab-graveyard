<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Graveyard</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <h1>🪦 Tab Graveyard</h1>
          <p>Archived inactive tabs</p>
        </div>
        <button id="settingsBtn" class="btn btn-icon" title="Settings">⚙️</button>
      </div>
    </header>
    
    <div class="controls-container">
      <input type="text" id="searchInput" placeholder="Search tabs...">
      
      <div class="actions-row">
        <select id="sortSelect" class="select-sort">
          <option value="dateDesc">Newest First</option>
          <option value="dateAsc">Oldest First</option>
          <option value="alphaAsc">A-Z</option>
          <option value="domain">Group by Domain</option>
        </select>
        <button id="deleteAllBtn" class="btn btn-delete-all">Clear All</button>
      </div>
    </div>

    <div id="tabsList" class="tabs-list">
      <!-- Tabs will be dynamically inserted here -->
    </div>
    
    <div id="emptyState" class="empty-state hidden">
      <p>Your graveyard is empty.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
